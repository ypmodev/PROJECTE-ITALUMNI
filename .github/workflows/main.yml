name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site
          cp -r assets data docs pages scripts styles _site/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=pages/welcome.html">
            <title>ITAlumni</title>
          </head>
          <body>
            <p>Cargando ITAlumni...</p>
          </body>
          </html>
          EOF

      
      - name: Fix absolute paths for GitHub Pages subpath
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Prefijando rutas absolutas con /$REPO_NAME/ ..."
          find _site -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) \
            -exec sed -i -E "s#([\"'])/([A-Za-z])#\1/${REPO_NAME}/\2#g" {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
