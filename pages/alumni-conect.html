<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Connect</title>

    
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/components/buttons.css">
    <link rel="stylesheet" href="/styles/components/cards.css">
    <link rel="stylesheet" href="/styles/components/navigation.css">
    <link rel="stylesheet" href="/styles/components/search-and-filters.css">
    <link rel="stylesheet" href="/styles/pages-styles/alumni-conect.css">

</head>
<body>
    <header class="mobile-header">

        <div class="mobile-header__leading">
            <a href="#home" class="mobile-header__back" id="mobile-back-btn" aria-label="Tornar a l'inici" hidden>
                <img src="/assets/icons/icon-arrow-left.svg" alt="">
            </a>

            <h1 class="mobile-header__title" id="mobile-header-title">Home</h1>

        </div>
 
        <div class="mobile-header__actions">
            <img src="assets/icons/statistics.svg" alt="" class="mobile-header__statistics">
            <img src="/assets/images/Avatar-2.jpg" alt="El meu perfil" class="mobile-header__avatar">
        </div>

    <header class="desktop-header">
        <a href="#home" class="desktop-header__brand">
            <img src="assets/logos/Logo-Alumni-Conect.svg" alt="" class="desktop-header__logo">
            <span class="desktop-header__title">Alumni Connect</span>
        </a>
 
        <nav class="desktop-nav" aria-label="Navegació principal" id="desktop-nav">
            <a href="#home" class="desktop-nav__link desktop-nav__link--active" data-tab="home" aria-current="page">Home</a>
            <a href="#networking" class="desktop-nav__link" data-tab="networking">Networking</a>
            <a href="#job-opportunities" class="desktop-nav__link" data-tab="job-opportunities">Job Opportunities</a>
        </nav>
 
        <div class="desktop-header__actions">
            <img src="/assets/icons/search.svg" alt="Cerca" class="desktop-header__icon">
            <img src="/assets/icons/icon-bell.svg" alt="Notificacions" class="desktop-header__icon">
            <img src="/assets/icons/icon-settings.svg" alt="Configuració" class="desktop-header__icon">
            <img src="/assets/images/Avatar-2.jpg" alt="El meu perfil" class="desktop-header__avatar">
        </div>
    </header>
        
    </header>
    
</body>
</html>
